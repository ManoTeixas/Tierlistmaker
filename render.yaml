# Blueprint do Render: cria o site a partir do Dockerfile.
# Plano gratuito: SEM disco persistente. Para as contas e listas não sumirem a cada deploy,
# defina DATABASE_URL com um Postgres (ex.: Neon ou Supabase, ambos têm plano grátis).
# Sem DATABASE_URL, os dados ficam em arquivos em /data e são apagados a cada reinício.
services:
  - type: web
    name: tierlistmaker
    runtime: docker
    plan: free
    branch: master
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        sync: false   # o Render pede o valor ao criar o serviço (não fica no repositório)
    # disk:
    #   name: dados
    #   mountPath: /data
    #   sizeGB: 1
